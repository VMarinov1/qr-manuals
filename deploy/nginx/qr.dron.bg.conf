# nginx за qr-manuals. Референтно копие: не се прилага автоматично.
# Инсталиране: вж. DEPLOY.md, стъпка 7.
#
# Сайтът е зад Cloudflare (оранжев облак). В Cloudflare: SSL/TLS режим "Full (strict)".
# "Flexible" не работи: Cloudflare ще говори с нас по http, а ние пренасочваме към https -> безкраен цикъл.
#
# Проверка след инсталиране:
#   curl -s -o /dev/null -w "%{http_code}\n" https://qr.dron.bg/health   # 200
#   curl -sI https://qr.dron.bg/health | grep -i '^server'                # server: cloudflare

server {
    listen 443 ssl http2;
    server_name qr.dron.bg;

    ssl_certificate     /etc/letsencrypt/live/qr.dron.bg/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qr.dron.bg/privkey.pem;

    # Реалният адрес на клиента от CF-Connecting-IP, но само за връзки от Cloudflare.
    # Без това всички заявки идват от адресите на Cloudflare и ограничението на входа
    # би блокирало всички потребители заедно.
    include /etc/nginx/snippets/cloudflare-real-ip.conf;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # Cloudflare (безплатен план) спира заявки над 100 MB още преди да стигнат до нас.
    # Приложението ограничава една заявка до MAX_REQUEST_MB (95) и го проверява и в браузъра.
    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:5200;
        proxy_set_header Host              $host;
        # $remote_addr тук вече е адресът на клиента (от реда include по-горе). Записва се
        # само той, а приложението (TRUST_PROXY=true) взима последния адрес в X-Forwarded-For.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Качванията отиват директно към приложението, което ги пише на диска поточно.
        proxy_request_buffering off;
        # Cloudflare чака отговор до 100 s. Обработката на снимките е под секунда на снимка.
        proxy_read_timeout 100s;
        proxy_send_timeout 100s;
    }
}

server {
    listen 80;
    server_name qr.dron.bg;
    # Нужен само за подновяването на сертификата (certbot). Cloudflare идва по 443.
    return 301 https://$host$request_uri;
}
