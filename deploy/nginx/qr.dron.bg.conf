# nginx за qr-manuals. Референтно копие: не се прилага автоматично.
# Инсталиране (вж. DEPLOY.md): копирай в /etc/nginx/sites-available/, направи symlink в sites-enabled и `nginx -t && systemctl reload nginx`.
#
# Проверка след инсталиране:
#   curl -s -o /dev/null -w "%{http_code}\n" https://qr.dron.bg/health   # 200
#   curl -s -o /dev/null -w "%{http_code}\n" http://qr.dron.bg/health    # 301

server {
    listen 443 ssl http2;
    server_name qr.dron.bg;

    ssl_certificate     /etc/letsencrypt/live/qr.dron.bg/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qr.dron.bg/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # До 20 файла × MAX_UPLOAD_MB (20) наведнъж. Приложението проверява всеки файл само.
    client_max_body_size 410m;

    location / {
        proxy_pass http://127.0.0.1:5200;
        proxy_set_header Host              $host;
        # Записва се само адресът, видян от nginx. Приложението (TRUST_PROXY=true) взима
        # последния адрес в X-Forwarded-For, така че клиентът не може да го подмени.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Големите качвания отиват директно към приложението, което ги пише на диска поточно,
        # вместо nginx първо да ги буферира целите.
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

server {
    listen 80;
    server_name qr.dron.bg;
    return 301 https://$host$request_uri;
}
