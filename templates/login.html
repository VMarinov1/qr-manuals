{% extends "base.html" %}

{% block title %}Вход · QR упътвания{% endblock %}

{% block content %}
<main class="flex min-h-screen items-center justify-center px-4">
  <div class="w-full max-w-sm">
    <div class="mb-10 flex flex-col items-center gap-4">
      <img src="/static/brand/ita-logo.svg?v={{ crate::web::asset_version() }}" alt="ITA Home &amp; Garden" width="200" height="46" class="h-12 w-auto">
      <p class="text-sm font-semibold uppercase tracking-[0.2em] text-brand-hover">QR упътвания</p>
    </div>

    <form method="post" action="/login"
          class="space-y-4 rounded-xl border-t-4 border-brand bg-white p-6 shadow-sm ring-1 ring-line">
      {% if let Some(error) = error %}
      <p role="alert" class="rounded-md bg-ita-red/5 px-3 py-2 text-sm text-ita-red">{{ error }}</p>
      {% endif %}

      <input type="hidden" name="next" value="{{ next }}">

      <label class="block">
        <span class="label">Email</span>
        <input type="email" name="email" value="{{ email }}" required autocomplete="username"
               {% if email.is_empty() %}autofocus{% endif %} class="input">
      </label>

      <label class="block">
        <span class="label">Парола</span>
        <input type="password" name="password" required autocomplete="current-password"
               {% if !email.is_empty() %}autofocus{% endif %} class="input">
      </label>

      <button type="submit" class="btn-primary w-full py-2.5 text-base">Вход</button>
    </form>
  </div>
</main>
{% endblock %}
