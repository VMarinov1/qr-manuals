{% extends "base.html" %}

{% block content %}
<header class="border-b-4 border-brand bg-white">
  <div class="mx-auto flex max-w-5xl items-center justify-between gap-4 px-4 py-3">
    <a href="/products" class="flex items-center gap-3">
      <img src="/static/brand/ita-logo.svg" alt="ITA Home &amp; Garden" width="200" height="46" class="h-8 w-auto">
      <span class="hidden border-l border-line pl-3 text-sm font-semibold uppercase tracking-[0.15em] text-brand-hover sm:inline">QR упътвания</span>
    </a>
    <div class="flex items-center gap-4 text-sm">
      <span class="hidden text-ink/60 sm:inline">{{ user.email }}</span>
      <form method="post" action="/logout">
        <button type="submit" class="font-semibold text-brand underline-offset-4 hover:text-brand-hover hover:underline">Изход</button>
      </form>
    </div>
  </div>
</header>

<main class="mx-auto max-w-5xl px-4 py-6">
  {% block main %}{% endblock %}
</main>

<script src="/static/vendor/htmx-2.0.4.min.js" defer></script>
<script>
  // Бутон с data-copy="текст" копира текста в клипборда.
  document.addEventListener('click', (event) => {
    const button = event.target.closest('[data-copy]');
    if (!button || !navigator.clipboard) return;
    navigator.clipboard.writeText(button.dataset.copy).then(() => {
      const label = button.textContent;
      button.textContent = 'Копирано';
      setTimeout(() => { button.textContent = label; }, 1500);
    });
  });

  // Проверка на размера преди качване, за да не стигне голяма заявка до Cloudflare,
  // който я спира със своя страница за грешка. Сървърът проверява същото отново.
  document.addEventListener('submit', (event) => {
    const form = event.target;
    if (!form.dataset.maxTotalMb) return;
    const files = [...form.querySelectorAll('input[type="file"]')].flatMap((input) => [...input.files]);
    const mb = (bytes) => (bytes / 1024 / 1024).toFixed(1).replace('.0', '');
    const maxFile = Number(form.dataset.maxFileMb) * 1024 * 1024;
    const maxTotal = Number(form.dataset.maxTotalMb) * 1024 * 1024;
    const total = files.reduce((sum, file) => sum + file.size, 0);
    const tooBig = files.filter((file) => file.size > maxFile);

    let error = '';
    if (tooBig.length) {
      error = tooBig.map((f) => `„${f.name}“ е ${mb(f.size)} MB, а може до ${form.dataset.maxFileMb} MB.`).join(' ');
    } else if (files.length > Number(form.dataset.maxFiles)) {
      error = `Избрани са ${files.length} файла, а наведнъж може до ${form.dataset.maxFiles}. Качи ги на няколко пъти.`;
    } else if (total > maxTotal) {
      error = `Избраните файлове са общо ${mb(total)} MB, а наведнъж може до ${form.dataset.maxTotalMb} MB. Качи ги на няколко пъти.`;
    }
    const box = form.querySelector('[data-upload-error]');
    if (box) { box.textContent = error; box.hidden = !error; }
    if (error) event.preventDefault();
  });

  // Форма с data-busy="текст" заключва бутона си, докато се изпраща (напр. при качване).
  document.addEventListener('submit', (event) => {
    const form = event.target;
    if (!form.dataset.busy || event.defaultPrevented) return;
    const button = form.querySelector('button[type="submit"]');
    if (!button) return;
    // След изпращането, за да не попречи disabled на самото изпращане.
    setTimeout(() => { button.disabled = true; button.textContent = form.dataset.busy; });
  });
</script>
{% endblock %}
