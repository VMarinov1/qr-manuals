{% extends "base.html" %}

{% block content %}
<header class="border-b border-slate-200 bg-white">
  <div class="mx-auto flex max-w-5xl items-center justify-between gap-4 px-4 py-3">
    <a href="/products" class="font-semibold tracking-tight">QR упътвания</a>
    <div class="flex items-center gap-4 text-sm">
      <span class="hidden text-slate-500 sm:inline">{{ user.email }}</span>
      <form method="post" action="/logout">
        <button type="submit" class="text-slate-700 underline-offset-4 hover:text-slate-900 hover:underline">Изход</button>
      </form>
    </div>
  </div>
</header>

<main class="mx-auto max-w-5xl px-4 py-6">
  {% block main %}{% endblock %}
</main>

<script src="/static/vendor/htmx-2.0.4.min.js" defer></script>
<script>
  // Бутон с data-copy="текст" копира текста в клипборда.
  document.addEventListener('click', (event) => {
    const button = event.target.closest('[data-copy]');
    if (!button || !navigator.clipboard) return;
    navigator.clipboard.writeText(button.dataset.copy).then(() => {
      const label = button.textContent;
      button.textContent = 'Копирано';
      setTimeout(() => { button.textContent = label; }, 1500);
    });
  });
</script>
{% endblock %}
