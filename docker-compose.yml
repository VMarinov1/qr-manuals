# Production и локално. nginx на хоста е единственият вход (deploy/nginx/qr.dron.bg.conf).
services:
  qr-manuals:
    container_name: qr-manuals
    # На сървъра: image от ghcr.io, записан в .env от scripts/deploy.sh (GitHub Actions).
    # Локално: билдва се от кода с `docker compose up -d --build`.
    image: ${QR_IMAGE:-qr-manuals}
    build: .
    restart: unless-stopped
    # Сървърът е споделен с ORTHOTEH: дори при атака това приложение не може да вземе
    # повече. Натоварващ тест на 1 ядро: ~2000 публични страници/s при ~110 MB памет.
    # Паметта е за качването на големи снимки (до 2 едновременно, вж. images.rs).
    cpus: 1.0
    mem_limit: 512m
    memswap_limit: 512m
    env_file:
      - qr-manuals.env # gitignored, само на сървъра. Пример: qr-manuals.env.example
    ports:
      # Само 127.0.0.1. С TRUST_PROXY=true приложението вярва на X-Forwarded-For,
      # затова никой не трябва да може да го достигне, заобикаляйки nginx.
      - 127.0.0.1:5200:8080
    volumes:
      # База, качени файлове и копия на базата. Собственик трябва да е uid 10001
      # (потребителят в контейнера): sudo chown -R 10001:10001 data
      - ./data:/data
