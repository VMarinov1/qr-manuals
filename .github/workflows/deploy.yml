name: Build and deploy

# Commit в main: билд (с тестовете в Dockerfile) -> ghcr.io -> деплой на qr.dron.bg.
# Pull request: само билд и тестове, без деплой.
#
# Secrets (Settings -> Secrets and variables -> Actions), същите имена като в ORTHOTEH:
#   VPS_HOST            - адрес на сървъра
#   VPS_USER            - SSH потребител (трябва да е в групата docker)
#   VPS_SSH_KEY         - частният SSH ключ на този потребител
#   VPS_SSH_PASSPHRASE  - паролата на ключа (празно, ако няма)
#   VPS_DEPLOY_PATH     - папката на приложението на сървъра (с qr-manuals.env и data/)
#
# Image-ът е private в ghcr.io. Сървърът го тегли с временния GITHUB_TOKEN на workflow-а,
# така че не трябва отделен PAT.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Два деплоя никога не вървят едновременно, а започнат деплой не се прекъсва.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Image name
        id: name
        # ghcr.io не приема главни букви в пътя.
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/qr-manuals"
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "image=$repo:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build, test and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.name.outputs.image }}
            ${{ steps.name.outputs.repo }}:latest
          # Зависимостите на Rust се кешират между билдовете.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    environment:
      name: production
      url: https://qr.dron.bg
    steps:
      - uses: actions/checkout@v4

      - name: Copy compose file and scripts to the server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          source: docker-compose.yml,scripts,deploy
          target: ${{ secrets.VPS_DEPLOY_PATH }}

      - name: Deploy
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          envs: IMAGE,GHCR_USER,GHCR_TOKEN
          script: |
            set -e
            cd "${{ secrets.VPS_DEPLOY_PATH }}"
            chmod +x scripts/*.sh
            ./scripts/deploy.sh "$IMAGE"

      - name: Check the public site
        run: |
          for _ in $(seq 1 10); do
            if [ "$(curl -s https://qr.dron.bg/health)" = ok ]; then echo "https://qr.dron.bg/health: ok"; exit 0; fi
            sleep 5
          done
          echo "https://qr.dron.bg/health не отговаря" >&2
          exit 1
